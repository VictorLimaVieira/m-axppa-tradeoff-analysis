name: Keep Streamlit App Awake

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Visit deployed app
        run: |
          curl --fail --location --retry 3 --retry-delay 10 \
            https://m-axppa-tradeoff-analysis.streamlit.app/ \
            --output /dev/null
